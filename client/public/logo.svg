<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <style>
      .icon-blue { fill: #1e3a8a; }
      .icon-green { fill: #10b981; }
      .text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 48px; fill: #1e3a8a; }
    </style>
  </defs>
  
  <!-- Icon: Stylized 'A' with Growth Logic -->
